# Gently demo — BIOS/MBR config
# Tests the BIOS + msdos partition table + GRUB with platforms = ["pc"].
# Disk: /dev/sda 8GB — MBR + BIOS

[system]
hostname = "gently-bios"
timezone = "Europe/Madrid"
locale   = "es_ES.UTF-8"
locales  = ["es_ES.UTF-8 UTF-8", "en_US.UTF-8 UTF-8"]
keymap   = "es"
lang     = "es_ES.UTF-8"

[stage3]
arch    = "amd64"
variant = "openrc"
mirror  = "https://distfiles.gentoo.org"

[[disks]]
id              = "primary"
device          = "/dev/sda"
partition_table = "msdos"
boot_mode       = "bios"

[[disks.partitions]]
label      = "boot"
size       = "512M"
filesystem = "ext2"
mount      = "/boot"

[[disks.partitions]]
label      = "swap"
size       = "512M"
filesystem = "swap"

[[disks.partitions]]
label         = "root"
size          = "remaining"
filesystem    = "ext4"
mount         = "/"
mount_options = "noatime"

[portage]
cflags          = "-O2 -pipe"
cxxflags        = "-O2 -pipe"
use             = ["-bluetooth", "-cups", "-X"]
accept_keywords = "amd64"
accept_license  = "@FREE"

[portage.profile]
name = "default/linux/amd64/23.0"

[kernel]
method = "binary"

[bootloader]
type = "grub"

[bootloader.grub]
platforms    = ["pc"]
install_disk = "/dev/sda"
timeout      = 5

[services.roles]
network = "NetworkManager"
ssh     = "openssh"
cron    = "cronie"
logging = "sysklogd"
ntp     = "chrony"

[[users.accounts]]
name   = "gently"
groups = ["wheel", "audio", "video", "usb", "plugdev"]
shell  = "/bin/bash"

[users]
credentials_file = "credentials.toml"
