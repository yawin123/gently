# Gently demo — binary packages config
# Tests the binrepos phase: sync_uri inferred from mirror + arch + profile version.
# Two repos: x86-64 baseline + x86-64-v3 optimized variant.
# getbinpkg=true so Portage prefers prebuilt packages.
# Disk: /dev/sda 8GB — GPT + UEFI

[system]
hostname = "gently-binpkg"
timezone = "Europe/Madrid"
locale   = "es_ES.UTF-8"
locales  = ["es_ES.UTF-8 UTF-8", "en_US.UTF-8 UTF-8"]
keymap   = "es"
lang     = "es_ES.UTF-8"

[stage3]
arch    = "amd64"
variant = "openrc"
mirror  = "https://distfiles.gentoo.org"

[[disks]]
id              = "primary"
device          = "/dev/sda"
partition_table = "gpt"
boot_mode       = "uefi"

[[disks.partitions]]
label      = "esp"
size       = "128M"
filesystem = "vfat"
mount      = "/boot/efi"
flags      = ["esp"]

[[disks.partitions]]
label      = "swap"
size       = "512M"
filesystem = "swap"

[[disks.partitions]]
label         = "root"
size          = "remaining"
filesystem    = "ext4"
mount         = "/"
mount_options = "noatime"

[portage]
cflags          = "-O2 -pipe"
cxxflags        = "-O2 -pipe"
use             = ["-bluetooth", "-cups", "-X"]
accept_keywords = "amd64"
accept_license  = "@FREE"
# Prefer prebuilt packages from binrepos
getbinpkg       = true
binpkg_format   = "gpkg"

[portage.profile]
name = "default/linux/amd64/23.0"

# sync_uri is inferred:
#   https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
[[portage.binrepos]]
name = "installkernel"
binary = false

# Add the x86-64-v3 variant if the CPU supports it (i5-11320H does).
# sync_uri inferred as .../binpackages/23.0/x86-64-v3/
[[portage.binrepos]]
name    = "gentoo-v3"
subarch = "x86-64-v3"

[kernel]
method = "binary"

[bootloader]
type = "grub"

[bootloader.grub]
platforms = ["efi-64"]
timeout   = 5

[services.roles]
network = "NetworkManager"
ssh     = "openssh"
cron    = "cronie"
logging = "sysklogd"
ntp     = "chrony"

[[users.accounts]]
name   = "gently"
groups = ["wheel", "audio", "video", "usb", "plugdev"]
shell  = "/bin/bash"

[users]
credentials_file = "credentials.toml"

[packages]
extra = [
    "app-editors/vim",
    "dev-vcs/git",
]
